server:
  port: 8871

spring:
  application:
    name: ride-hailing-multiagent
  datasource:
    # H2 文件库：重启数据不丢；生产切换 MySQL 只需替换 url/username/password
    url: jdbc:h2:file:./data/ride;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: ride
    password: ride123
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: warn
